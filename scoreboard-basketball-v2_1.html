<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zone Total Sport — Tableau Basketball</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Bangers&display=swap" rel="stylesheet">
<style>
  :root{
    --bleu:#15a8e0;          /* DOMICILE */
    --bleu-fonce:#0a7fb0;
    --rose:#ff5fa2;          /* VISITEUR / RETOUR */
    --rose-fonce:#e0408a;
    --jaune:#ffe600;
    --vert:#3ddc6e;
    --orange:#ff9f1c;
    --encre:#0e3a4f;         /* texte sombre principal */
    --panneau:#0d1b2a;       /* fond zone chrono */
    --fond:#dff3fc;
    --blanc:#ffffff;
    --ombre:5px 5px 0 rgba(14,58,79,.85);
    --ombre-sm:3px 3px 0 rgba(14,58,79,.7);

    --titre:'Luckiest Guy', cursive;   /* gros titres + chiffres */
    --corps:'Bangers', cursive;        /* labels, boutons */
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  body{
    font-family:var(--corps);
    letter-spacing:.5px;
    background:
      radial-gradient(circle at 12% 22%, rgba(21,168,224,.18), transparent 38%),
      radial-gradient(circle at 88% 78%, rgba(255,95,162,.15), transparent 42%),
      var(--fond);
    background-image:
      radial-gradient(circle at 12% 22%, rgba(21,168,224,.18), transparent 38%),
      radial-gradient(circle at 88% 78%, rgba(255,95,162,.15), transparent 42%),
      radial-gradient(rgba(14,58,79,.07) 1.2px, transparent 1.2px);
    background-size:auto,auto,22px 22px;
    background-attachment:fixed;
    color:var(--encre);min-height:100vh;
  }

  /* ====================== HEADER ZTS ====================== */
  .zts-header{
    position:relative;
    background:linear-gradient(180deg,#22d3ff 0%, #15a8e0 55%, #0a7fb0 100%);
    border-bottom:5px solid var(--encre);
    padding:18px 26px 26px;
    text-align:center;
    box-shadow:0 6px 0 rgba(14,58,79,.25);
  }
  .zts-title{
    font-family:var(--titre);
    font-size:clamp(38px,6vw,76px);
    line-height:1;color:var(--blanc);
    text-shadow:3px 3px 0 var(--encre), 6px 6px 0 rgba(14,58,79,.35);
    letter-spacing:2px;
  }
  .zts-title .y{color:var(--jaune);}
  .zts-sub{
    font-family:var(--titre);
    font-size:clamp(20px,3vw,34px);
    color:var(--jaune);
    text-shadow:2px 2px 0 var(--encre);
    letter-spacing:3px;margin-top:6px;
    display:inline-flex;align-items:center;gap:12px;
  }
  .zts-sub .mascotte{
    width:46px;height:46px;border-radius:10px;background:var(--blanc);
    border:2px solid var(--encre);display:inline-flex;
    align-items:center;justify-content:center;font-size:26px;
    box-shadow:var(--ombre-sm);
  }
  .zts-clock{
    display:inline-block;margin-top:10px;
    font-family:var(--titre);font-size:30px;color:var(--blanc);
    background:var(--panneau);border:3px solid var(--encre);
    border-radius:16px;padding:4px 26px;
    box-shadow:var(--ombre-sm);letter-spacing:2px;
  }
  /* boutons accueil / retour : positionnés aux coins */
  .nav-btn{
    position:absolute;top:50%;transform:translateY(-50%);
    font-family:var(--corps);font-size:24px;letter-spacing:1px;
    border:4px solid var(--encre);border-radius:18px;
    padding:10px 24px;cursor:pointer;color:var(--encre);
    box-shadow:var(--ombre);display:flex;align-items:center;gap:8px;
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .nav-btn:hover{transform:translateY(-50%) translate(-1px,-1px);}
  .nav-btn:active{transform:translateY(-50%) translate(2px,2px);box-shadow:1px 1px 0 rgba(14,58,79,.7);}
  .nav-accueil{left:26px;background:var(--jaune);}
  .nav-retour{right:26px;background:var(--rose);color:var(--blanc);text-shadow:1px 1px 0 var(--encre);}

  /* ====================== CONTENU ====================== */
  .wrap{max-width:1180px;margin:0 auto;padding:18px;}

  /* ---------- BARRE SPORTS + OUTILS ---------- */
  .toolbar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;
  }
  .page-label{
    font-family:var(--titre);font-size:30px;color:var(--encre);
    display:flex;align-items:center;gap:8px;margin-right:auto;letter-spacing:1px;
  }
  .sport-tab,.tool-btn{
    font-family:var(--corps);font-size:20px;letter-spacing:1px;
    border:3px solid var(--encre);border-radius:14px;
    padding:7px 16px;background:var(--blanc);color:var(--encre);
    cursor:pointer;box-shadow:var(--ombre-sm);
    transition:transform .08s ease;display:flex;align-items:center;gap:7px;white-space:nowrap;
  }
  .sport-tab:hover,.tool-btn:hover{transform:translate(-1px,-1px);}
  .sport-tab:active,.tool-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(14,58,79,.7);}
  .sport-tab.active{background:var(--jaune);}

  /* ---------- BANDEAU CHRONO ---------- */
  .chrono-bar{
    background:var(--panneau);border:4px solid var(--encre);border-radius:22px;
    box-shadow:var(--ombre);padding:14px 20px;margin-bottom:16px;
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;
  }
  .periode{
    font-family:var(--corps);font-size:22px;letter-spacing:1px;
    background:var(--jaune);color:var(--encre);
    border:3px solid var(--encre);border-radius:30px;
    padding:5px 18px;justify-self:start;box-shadow:var(--ombre-sm);
  }
  .chrono-main{text-align:center;}
  .chrono-main .time{
    font-family:var(--titre);font-size:clamp(60px,9vw,96px);line-height:.9;
    color:var(--orange);
    text-shadow:0 0 18px rgba(255,159,28,.65), 4px 4px 0 rgba(0,0,0,.35);
    letter-spacing:2px;
  }
  .chrono-controls{display:flex;gap:8px;justify-content:center;margin-top:8px;}
  .mini{
    font-family:var(--corps);font-size:15px;letter-spacing:.5px;
    border:2px solid var(--encre);border-radius:10px;
    background:var(--blanc);padding:5px 12px;cursor:pointer;color:var(--encre);
    box-shadow:2px 2px 0 rgba(14,58,79,.6);
  }
  .mini.go{background:var(--vert);width:44px;height:44px;border-radius:50%;font-size:20px;padding:0;}
  .mini:hover{transform:translate(-1px,-1px);}
  .shotclock{justify-self:end;text-align:center;}
  .shotclock .label{font-family:var(--corps);font-size:16px;color:var(--vert);letter-spacing:2px;}
  .shotclock .val{
    font-family:var(--titre);font-size:clamp(40px,6vw,58px);line-height:1;
    color:var(--vert);text-shadow:0 0 14px rgba(61,220,110,.6);
  }
  .shotclock .presets{display:flex;gap:6px;justify-content:center;margin-top:4px;}

  /* ---------- COLONNES ÉQUIPES ---------- */
  .teams{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .team{border:4px solid var(--encre);border-radius:22px;box-shadow:var(--ombre);overflow:hidden;display:flex;flex-direction:column;}
  .team.home{background:var(--bleu);}
  .team.away{background:var(--rose);}
  .team-head{display:flex;align-items:center;gap:12px;padding:12px 16px;}
  .team-photo{
    width:54px;height:54px;border-radius:14px;background:rgba(255,255,255,.25);
    border:2px dashed rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;
    font-size:24px;color:#fff;flex-shrink:0;cursor:pointer;
  }
  .team-name{font-family:var(--titre);font-size:30px;color:#fff;letter-spacing:1px;text-shadow:2px 2px 0 rgba(0,0,0,.3);}

  /* SCORE GÉANT */
  .score{
    font-family:var(--titre);font-size:clamp(96px,16vw,160px);line-height:.85;text-align:center;
    color:#fff;text-shadow:5px 5px 0 rgba(0,0,0,.3), 0 0 30px rgba(255,255,255,.25);
    padding:4px 0 14px;user-select:none;
  }
  .points{display:flex;gap:10px;padding:0 16px 12px;}
  .pt{
    flex:1;font-family:var(--titre);font-size:32px;
    border:3px solid var(--encre);border-radius:16px;padding:14px 0;cursor:pointer;color:var(--encre);
    box-shadow:var(--ombre-sm);transition:transform .07s ease;letter-spacing:1px;
  }
  .home .pt{background:#bfe9fb;}
  .away .pt{background:#ffd0e6;}
  .pt:hover{transform:translate(-1px,-1px);}
  .pt:active{transform:translate(2px,3px);box-shadow:1px 1px 0 rgba(14,58,79,.6);}
  .retrait{
    margin:0 16px 14px;width:calc(100% - 32px);font-family:var(--corps);font-size:18px;letter-spacing:1px;
    background:rgba(255,255,255,.9);border:2px solid var(--encre);border-radius:12px;padding:8px 0;cursor:pointer;color:var(--encre);
  }
  .retrait:hover{background:#fff;}

  /* INFOS SECONDAIRES */
  .secondary{background:rgba(255,255,255,.93);border-top:3px solid var(--encre);display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:12px 16px;}
  .stat{display:flex;flex-direction:column;align-items:center;gap:5px;}
  .stat .stat-label{font-family:var(--corps);font-size:17px;letter-spacing:1px;color:var(--encre);}
  .stat-row{display:flex;align-items:center;gap:8px;}
  .dots{display:flex;gap:4px;}
  .dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--encre);background:transparent;}
  .dot.on{background:var(--orange);}
  .stat-val{font-family:var(--titre);font-size:24px;min-width:22px;text-align:center;}
  .step{font-family:var(--titre);font-size:18px;width:32px;height:32px;border:2px solid var(--encre);border-radius:9px;background:var(--blanc);cursor:pointer;line-height:1;box-shadow:2px 2px 0 rgba(14,58,79,.5);}
  .step.plus{background:var(--jaune);}
  .step:active{transform:translate(1px,1px);}

  /* BARRE CENTRALE */
  .midbar{display:flex;gap:10px;justify-content:center;margin-top:16px;}
  .midbar button{font-family:var(--corps);font-size:20px;letter-spacing:1px;border:3px solid var(--encre);border-radius:14px;padding:10px 26px;cursor:pointer;color:var(--encre);box-shadow:var(--ombre-sm);}
  .fin{background:var(--jaune);}
  .poss{background:var(--blanc);}
  .midbar button:hover{transform:translate(-1px,-1px);}

  /* RESPONSIVE */
  @media(max-width:820px){
    .nav-btn{position:static;transform:none;margin:0 6px;font-size:18px;padding:8px 16px;}
    .nav-btn:hover,.nav-btn:active{transform:none;}
    .zts-nav-row{display:flex;justify-content:space-between;margin-bottom:8px;}
  }
  @media(max-width:760px){
    .chrono-bar{grid-template-columns:1fr;gap:10px;}
    .periode,.shotclock{justify-self:center;}
    .teams{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

  <!-- ====================== HEADER ====================== -->
  <header class="zts-header">
    <button class="nav-btn nav-accueil">⌂ ACCUEIL</button>
    <button class="nav-btn nav-retour">‹ RETOUR</button>

    <div class="zts-title">ZONE <span class="y">TOTAL</span> SPORT</div>
    <div class="zts-sub">TABLEAU DE POINTAGE <span class="mascotte">🪓</span></div>
    <div class="zts-clock" id="liveClock">15:40</div>
  </header>

  <div class="wrap">

    <!-- BARRE SPORTS + OUTILS -->
    <div class="toolbar">
      <div class="page-label">🏀 BASKETBALL</div>
      <button class="sport-tab active">🏀 Basketball</button>
      <button class="sport-tab">🏒 Hockey</button>
      <button class="sport-tab">🏈 Football</button>
      <button class="tool-btn" title="Klaxon">📣</button>
      <button class="tool-btn" title="Son">🔊</button>
      <button class="tool-btn" title="Réglages">⚙️</button>
      <button class="tool-btn" title="Réinitialiser">🗑️</button>
      <button class="tool-btn" style="background:var(--vert)">⛶ Ajuster</button>
    </div>

    <!-- BANDEAU CHRONO -->
    <div class="chrono-bar">
      <div class="periode">PÉRIODE 1 / 4</div>
      <div class="chrono-main">
        <div class="time" id="gameClock">10:00</div>
        <div class="chrono-controls">
          <button class="mini go">▶</button>
          <button class="mini">↺ Reset</button>
          <button class="mini">Chrono 100%</button>
        </div>
      </div>
      <div class="shotclock">
        <div class="label">CHRONO TIR</div>
        <div class="val">24</div>
        <div class="presets">
          <button class="mini">24s</button>
          <button class="mini">30s</button>
          <button class="mini">35s</button>
        </div>
      </div>
    </div>

    <!-- ÉQUIPES -->
    <div class="teams">
      <!-- DOMICILE -->
      <div class="team home">
        <div class="team-head"><div class="team-photo">🖼️</div><div class="team-name">DOMICILE</div></div>
        <div class="score" id="scoreHome">0</div>
        <div class="points">
          <button class="pt" data-team="home" data-pts="1">+1</button>
          <button class="pt" data-team="home" data-pts="2">+2</button>
          <button class="pt" data-team="home" data-pts="3">+3</button>
        </div>
        <button class="retrait" data-team="home" data-pts="-1">RETIRER 1 PT</button>
        <div class="secondary">
          <div class="stat">
            <span class="stat-label">⚠ FAUTES</span>
            <div class="stat-row"><button class="step">−</button><span class="stat-val" id="foulHome">0</span><button class="step plus">+</button></div>
            <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
          </div>
          <div class="stat">
            <span class="stat-label">⏱ TEMPS-MORTS</span>
            <div class="stat-row"><button class="step">−</button><span class="stat-val" id="toHome">0</span><button class="step plus">+</button></div>
          </div>
        </div>
      </div>
      <!-- VISITEUR -->
      <div class="team away">
        <div class="team-head"><div class="team-photo">🖼️</div><div class="team-name">VISITEUR</div></div>
        <div class="score" id="scoreAway">0</div>
        <div class="points">
          <button class="pt" data-team="away" data-pts="1">+1</button>
          <button class="pt" data-team="away" data-pts="2">+2</button>
          <button class="pt" data-team="away" data-pts="3">+3</button>
        </div>
        <button class="retrait" data-team="away" data-pts="-1">RETIRER 1 PT</button>
        <div class="secondary">
          <div class="stat">
            <span class="stat-label">⚠ FAUTES</span>
            <div class="stat-row"><button class="step">−</button><span class="stat-val" id="foulAway">0</span><button class="step plus">+</button></div>
            <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
          </div>
          <div class="stat">
            <span class="stat-label">⏱ TEMPS-MORTS</span>
            <div class="stat-row"><button class="step">−</button><span class="stat-val" id="toAway">0</span><button class="step plus">+</button></div>
          </div>
        </div>
      </div>
    </div>

    <!-- BARRE CENTRALE -->
    <div class="midbar">
      <button class="poss">⟳ POSSESSION</button>
      <button class="fin">FIN DE PÉRIODE</button>
    </div>

  </div>

<script>
  // horloge live dans le header
  function tick(){
    const d=new Date();
    document.getElementById('liveClock').textContent=
      String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  }
  tick(); setInterval(tick,1000);

  // score
  const scores={home:0,away:0};
  document.querySelectorAll('.pt, .retrait').forEach(b=>{
    b.addEventListener('click',()=>{
      const t=b.dataset.team,p=parseInt(b.dataset.pts);
      scores[t]=Math.max(0,scores[t]+p);
      document.getElementById('score'+(t==='home'?'Home':'Away')).textContent=scores[t];
    });
  });
  // fautes + temps-morts
  document.querySelectorAll('.secondary').forEach(sec=>{
    sec.querySelectorAll('.stat').forEach(stat=>{
      const val=stat.querySelector('.stat-val');
      const dots=stat.querySelectorAll('.dot');
      let n=0;
      stat.querySelectorAll('.step').forEach(btn=>{
        btn.addEventListener('click',()=>{
          n=Math.max(0,n+(btn.classList.contains('plus')?1:-1));
          val.textContent=n;
          dots.forEach((d,i)=>d.classList.toggle('on',i<n));
        });
      });
    });
  });
</script>
</body>
</html>
