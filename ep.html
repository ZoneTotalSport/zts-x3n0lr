<!DOCTYPE html>
<!-- HUB MÉTIER — Éducation physique. Sur le design system partagé. -->
<html lang="fr-CA" data-metier="ep">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Éducation physique — Zone Total Sport</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Bangers&family=Fredoka:wght@400;600;700&family=Quicksand:wght@400;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/zts.css">
</head>
<body>

  <div data-zts-header></div>

  <nav class="zts-subnav">
    <a href="index.html" data-i18n="subnav.back_home">← Accueil</a>
  </nav>

  <main class="zts-container" style="padding-top:var(--space-4); padding-bottom:var(--space-7);">

    <section class="zts-metier-banner" style="margin-bottom:var(--space-5);">
      <div>
        <span class="zts-metier-banner__pill" data-i18n="hub.ep.pill">Zone ÉP</span>
        <h1 style="margin-top:10px;" data-i18n="hub.ep.title">Ton gym, tes règles.</h1>
        <p style="margin-top:8px; font-family:var(--font-body); font-size:var(--fs-2); max-width:60ch;" data-i18n="hub.ep.intro">Toutes tes apps d'éducation physique, réunies au même endroit.</p>
      </div>
    </section>

    <h2 style="font-family:var(--font-impact); font-size:var(--fs-4); margin:var(--space-4) 0 var(--space-3);" data-i18n="hub.active">Apps prêtes à l'emploi</h2>
    <div class="zts-grid" id="gridActive"></div>

    <h2 style="font-family:var(--font-impact); font-size:var(--fs-4); margin:var(--space-6) 0 var(--space-3); opacity:.8;" data-i18n="hub.coming">Bientôt disponibles</h2>
    <div class="zts-grid" id="gridSoon"></div>

  </main>

  <div data-zts-footer></div>

  <script src="shared/zts.js"></script>
  <script>
    // ===== Apps du hub ÉP (bilingue) — rendu piloté par la langue active =====
    const ACTIVE = [
      { icon:'📅', url:'https://zonetotalsport.ca/apps/planificateur/', tag:'pro', fr:{n:'Planificateur ÉPS',d:'Calendrier scolaire, séances et évaluation'}, en:{n:'PE Planner',d:'School calendar, sessions and assessment'} },
      { icon:'🏀', url:'https://zonetotalsport.ca/apps/scoreboard/', fr:{n:'Tableau indicateur',d:'Scoreboard 3 sports, mode TNI'}, en:{n:'Scoreboard',d:'3-sport scoreboard, IWB mode'} },
      { icon:'🧰', url:'https://zonetotalsport.ca/apps/transitions/', fr:{n:'Boîte à outils',d:'Signaux, chrono, équipes, message'}, en:{n:'Toolbox',d:'Signals, timer, teams, message'} },
      { icon:'🎒', url:'https://zonetotalsport.ca/apps/cours-maternelle/', fr:{n:'90 cours maternelle',d:'90 séances clé en main, 4-6 ans'}, en:{n:'90 kindergarten lessons',d:'90 turnkey sessions, ages 4-6'} },
      { icon:'🎮', url:'https://jeux.zonetotalsport.ca', fr:{n:'Banque de jeux',d:'1439 jeux filtrables avec fiches'}, en:{n:'Game bank',d:'1,439 filterable games with sheets'} },
      { icon:'📚', url:'https://sae.zonetotalsport.ca', fr:{n:'SAÉ PFEQ',d:"Banque de situations d'apprentissage"}, en:{n:'PFEQ lessons',d:'Bank of learning situations'} },
      { icon:'🤖', url:'https://generateur.zonetotalsport.ca', tag:'ia', fr:{n:'Générateur SAÉ IA',d:'Crée une SAÉ PFEQ en 10 secondes'}, en:{n:'AI SAÉ generator',d:'Build a PFEQ lesson in 10 seconds'} },
      { icon:'📋', url:'https://educatifs.zonetotalsport.ca', fr:{n:"Banque d'éducatifs",d:'Fiches techniques par sport'}, en:{n:'Drills bank',d:'Technique sheets by sport'} },
      { icon:'🗓️', url:'https://grille.zonetotalsport.ca', fr:{n:'Grille horaire',d:'Spécialistes, locaux et groupes'}, en:{n:'Schedule grid',d:'Specialists, rooms and groups'} },
      { icon:'📊', url:'https://evaluation.zonetotalsport.ca', fr:{n:'Carnet ÉPS',d:'Évaluation et présences'}, en:{n:'PE gradebook',d:'Assessment and attendance'} },
      { icon:'🖍️', url:'https://tni.zonetotalsport.ca', fr:{n:'Tableau blanc TNI',d:'Dessin et projection au tableau'}, en:{n:'IWB whiteboard',d:'Draw and project on the board'} },
      { icon:'🎵', url:'https://musique.zonetotalsport.ca', fr:{n:'Musique',d:'Playlists par moment de cours'}, en:{n:'Music',d:'Playlists by class moment'} },
      { icon:'🗒️', url:'https://agenda.zonetotalsport.ca', tag:'new', fr:{n:'Agenda',d:"Ton agenda d'enseignant en ligne"}, en:{n:'Agenda',d:'Your online teacher planner'} },
      { icon:'🤸', url:'https://gym.zonetotalsport.ca', tag:'new', fr:{n:'App Gym',d:'Outils interactifs pour le gymnase'}, en:{n:'Gym App',d:'Interactive tools for the gym'} },
      { icon:'🦺', url:'https://suppleance.zonetotalsport.ca', fr:{n:'Ma Suppléance',d:'Plans clé en main pour suppléants'}, en:{n:'My Substitute',d:'Turnkey plans for substitutes'} },
      { icon:'🌍', url:'https://zonetotalsport.ca/repertoire.html', fr:{n:'Répertoire mondial',d:"Profs d'ÉP du monde entier"}, en:{n:'World directory',d:'PE teachers worldwide'} },
      { icon:'✏️', url:'https://zonetotalsport.ca/blog.html', fr:{n:'Blog ÉPS',d:'23+ articles pratiques'}, en:{n:'PE Blog',d:'23+ practical articles'} },
      { icon:'🤝', url:'https://zonetotalsport.ca/aidons-nous/', fr:{n:'Communauté ÉPS',d:'Forum Aidons-nous'}, en:{n:'PE Community',d:'Aidons-nous forum'} }
    ];
    const SOON = [
      { icon:'🏃', fr:{n:'Échauffements',d:'50+ routines par âge'}, en:{n:'Warm-ups',d:'50+ routines by age'} },
      { icon:'🏅', fr:{n:'Olympiades scolaires',d:'Calendrier et épreuves'}, en:{n:'School olympics',d:'Schedule and events'} },
      { icon:'🌧️', fr:{n:'Plan B météo',d:'Activités selon la météo'}, en:{n:'Weather plan B',d:'Activities by weather'} },
      { icon:'🧩', fr:{n:'Énigmes & devinettes',d:'Casse-tête par âge'}, en:{n:'Riddles & puzzles',d:'Brain teasers by age'} },
      { icon:'🎤', fr:{n:'Comptines & chansons',d:'Banque audio + paroles'}, en:{n:'Rhymes & songs',d:'Audio bank + lyrics'} },
      { icon:'🛡️', fr:{n:'Intervention Groupe',d:'PWA tout-en-un : 60 jeux, SOS crise'}, en:{n:'Group Intervention',d:'All-in-one PWA: 60 games, crisis SOS'} }
    ];

    function tagHtml(tag){
      if(!tag) return '';
      const key = tag==='ia'?'tag.ia':tag==='new'?'tag.new':'tag.pro';
      return `<span class="zts-tag zts-tag--${tag}">${ZTS.t(key)}</span>`;
    }
    function renderHub(){
      const L = ZTS.getLang();
      document.getElementById('gridActive').innerHTML = ACTIVE.map(a=>`
        <a class="zts-app-card" href="${a.url}" target="_blank" rel="noopener">
          ${tagHtml(a.tag)}
          <span class="zts-app-card__icon">${a.icon}</span>
          <span class="zts-app-card__name">${a[L].n}</span>
          <span class="zts-app-card__desc">${a[L].d}</span>
        </a>`).join('');
      document.getElementById('gridSoon').innerHTML = SOON.map(a=>`
        <div class="zts-app-card is-soon" aria-disabled="true">
          <span class="zts-tag zts-tag--soon">${ZTS.t('tag.soon')}</span>
          <span class="zts-app-card__icon">${a.icon}</span>
          <span class="zts-app-card__name">${a[L].n}</span>
          <span class="zts-app-card__desc">${a[L].d}</span>
        </div>`).join('');
    }
    document.addEventListener('zts:ready', renderHub);
    document.addEventListener('zts:langchange', renderHub);
  </script>
</body>
</html>
